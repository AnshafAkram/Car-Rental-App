<!-- ========================= -->
<!-- REGISTER PAGE -->
<!-- ========================= -->

<section style="
    min-height:100vh;
    display:flex;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card border-0 shadow-lg"
                     style="border-radius:15px;">

                    <div class="card-body p-5">

                        <h3 class="fw-bold text-center mb-4">
                            Create Account
                        </h3>

                        <div class="row g-3">

                            <!-- Full Name -->
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="John Doe">
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" placeholder="+94 77 123 4567">
                            </div>

                            <!-- Email -->
                            <div class="col-12">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Enter email">
                            </div>

                            <!-- NIC -->
                            <div class="col-12">
                                <label class="form-label">NIC</label>
                                <input type="text" class="form-control" placeholder="National ID">
                            </div>

                            <!-- Password -->
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Password">
                            </div>

                            <!-- Confirm Password -->
                            <div class="col-md-6">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" placeholder="Confirm">
                            </div>

                        </div>

                        <!-- Terms -->
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">
                                I agree to the terms and conditions
                            </label>
                        </div>

                        <!-- Register Button -->
                        <button class="btn btn-success w-100 mt-3 py-2">
                            Create Account
                        </button>

                        <!-- Login Link -->
                        <p class="text-center mt-3 mb-0">
                            Already have an account?
                            <a routerLink="/login" class="text-primary text-decoration-none">
                                Login
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
