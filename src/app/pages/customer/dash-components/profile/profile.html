<section style="padding-bottom:80px; background:#f8f9fa;">

    <div class="container">

        <!-- Section Title -->
        <div class="mb-4">

            <h3 class="fw-bold">
                My Profile
            </h3>

            <p class="text-muted">
                Manage your personal information and account settings.
            </p>

        </div>

        <div class="row g-4">

            <!-- Profile Card -->
            <div class="col-lg-4">

                <div class="card border-0 shadow-sm text-center"
                     style="border-radius:15px;">

                    <div class="card-body p-4">

                        <!-- Profile Image -->
                        <img src="https://i.pravatar.cc/150?img=12"
                             class="rounded-circle mb-3"
                             width="100"
                             height="100"
                             style="object-fit:cover;">

                        <h5 class="fw-bold mb-1">
                            Mohamed Anshaf
                        </h5>

                        <p class="text-muted mb-3">
                            anshaf@example.com
                        </p>

                        <button class="btn btn-primary btn-sm w-100 mb-2">
                            Edit Profile
                        </button>

                        <button class="btn btn-outline-secondary btn-sm w-100">
                            Change Password
                        </button>

                    </div>

                </div>

            </div>

            <!-- Details Form -->
            <div class="col-lg-8">

                <div class="card border-0 shadow-sm"
                     style="border-radius:15px;">

                    <div class="card-body p-4">

                        <h5 class="fw-bold mb-4">
                            Personal Information
                        </h5>

                        <div class="row g-3">

                            <!-- Name -->
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" value="Mohamed Anshaf">
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" value="anshaf@example.com">
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" value="+94 77 123 4567">
                            </div>

                            <!-- NIC -->
                            <div class="col-md-6">
                                <label class="form-label">NIC</label>
                                <input type="text" class="form-control" value="200012345678">
                            </div>

                            <!-- Address -->
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" rows="3">Negombo, Sri Lanka</textarea>
                            </div>

                        </div>

                        <!-- Save Button -->
                        <div class="mt-4">

                            <button class="btn btn-success px-5">
                                Save Changes
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
