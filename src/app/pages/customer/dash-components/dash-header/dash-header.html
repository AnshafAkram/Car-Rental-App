<section style="padding:80px 0; background:#f8f9fa;">

    <div class="container">

        <!-- Welcome Header -->
        <div class="mb-5">

            <h2 class="fw-bold">
                Welcome Back, John 👋
            </h2>

            <p class="text-muted">
                Here is your booking overview and activity summary.
            </p>

        </div>

        <!-- ========================= -->
        <!-- STATS CARDS -->
        <!-- ========================= -->

        <div class="row g-4">

            <!-- Active Bookings -->
            <div class="col-lg-3 col-md-6">

                <div class="card border-0 shadow-sm text-center"
                     style="border-radius:15px;">

                    <div class="card-body p-4">

                        <h1 class="fw-bold text-primary">
                            2
                        </h1>

                        <p class="mb-0 text-muted">
                            Active Bookings
                        </p>

                    </div>

                </div>

            </div>

            <!-- Completed -->
            <div class="col-lg-3 col-md-6">

                <div class="card border-0 shadow-sm text-center"
                     style="border-radius:15px;">

                    <div class="card-body p-4">

                        <h1 class="fw-bold text-success">
                            5
                        </h1>

                        <p class="mb-0 text-muted">
                            Completed Trips
                        </p>

                    </div>

                </div>

            </div>

            <!-- Payments -->
            <div class="col-lg-3 col-md-6">

                <div class="card border-0 shadow-sm text-center"
                     style="border-radius:15px;">

                    <div class="card-body p-4">

                        <h1 class="fw-bold text-warning">
                            7
                        </h1>

                        <p class="mb-0 text-muted">
                            Total Payments
                        </p>

                    </div>

                </div>

            </div>

            <!-- Cancelled -->
            <div class="col-lg-3 col-md-6">

                <div class="card border-0 shadow-sm text-center"
                     style="border-radius:15px;">

                    <div class="card-body p-4">

                        <h1 class="fw-bold text-danger">
                            1
                        </h1>

                        <p class="mb-0 text-muted">
                            Cancelled Bookings
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
