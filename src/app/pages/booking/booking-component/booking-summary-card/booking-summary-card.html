
<!-- ========================= -->
<!-- BOOKING SUMMARY CARD -->
<!-- ========================= -->



    <div class="card border-0 shadow-lg"
         style="border-radius:15px; position:sticky; top:90px;">

        <!-- Vehicle Image -->
        <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=800&q=80"
             class="card-img-top"
             style="height:220px; object-fit:cover; border-radius:15px 15px 0 0;">

        <div class="card-body p-4">

            <h4 class="fw-bold mb-1">
                Booking Summary
            </h4>

            <p class="text-muted mb-4">
                Review your reservation before proceeding.
            </p>

            <h5 class="fw-bold">
                Toyota Axio 2018
            </h5>

            <span class="badge bg-success mb-4">
                Available
            </span>

            <hr>

            <div class="d-flex justify-content-between mb-3">
                <span>Price / Day</span>
                <strong>Rs. 8,500</strong>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <span>Rental Days</span>
                <strong>2 Days</strong>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <span>Driver Service</span>
                <strong>No</strong>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <span>Security Deposit</span>
                <strong>Rs. 20,000</strong>
            </div>

            <hr>

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h5 class="mb-0">
                    Total
                </h5>

                <h3 class="text-primary fw-bold mb-0">
                    Rs. 37,000
                </h3>

            </div>

            <button class="btn btn-primary btn-lg w-100"
                    routerLink="/pay"
                    style="border-radius:10px;">

                Proceed to Payment

            </button>

            <button class="btn btn-outline-secondary w-100 mt-3"
                    style="border-radius:10px;">

                Back to Vehicle Details

            </button>

        </div>

    </div>
