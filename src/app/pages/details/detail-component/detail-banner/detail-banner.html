<!-- ========================= -->
<!-- VEHICLE DETAILS BANNER -->
<!-- ========================= -->

<section style="
    background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-position: center;
    padding: 90px 0;
    color: white;
">


    <div class="container text-center">


        <!-- Breadcrumb -->

        <nav aria-label="breadcrumb">


            <ol class="breadcrumb justify-content-center mb-3">


                <li class="nav-item mx-2">

                    <a class="nav-link fw-semibold"
                       routerLink="/"
                       style="color:#f0f2f5;">

                        Home

                    </a>

                </li>




                <li class="nav-item mx-2">

                    <a class="nav-link fw-semibold active"
                       routerLink="/cars"
                       style="color:#ececec;">

                        Vehicles

                    </a>

                </li>




                <li class="nav-item mx-2">

                    <a class="nav-link fw-semibold"
                       style="color:#ffffff;">

                        Details

                    </a>

                </li>




                <li class="nav-item mx-2">

                    <a class="nav-link fw-semibold"
                       routerLink="/bookings"
                       style="color:#fcfeff;">

                        Bookings

                    </a>

                </li>




                <li class="nav-item mx-2">

                    <a class="nav-link fw-semibold"
                       routerLink="/dashboard"
                       style="color:#ffffff;">

                        Dashboard

                    </a>

                </li>




                <li class="nav-item mx-2">

                    <a class="nav-link fw-semibold"
                       routerLink="/admin"
                       style="color:#fdfeff;">

                        Admin

                    </a>

                </li>



            </ol>


        </nav>





        <!-- Dynamic Vehicle Title -->

        <h1 class="display-4 fw-bold mb-3">


            {{vehicle?.brand}} {{vehicle?.model}}


        </h1>





        <!-- Dynamic Subtitle -->

        <p class="lead mb-0" style="opacity:0.9;">


            {{vehicle?.description || 
            'Comfortable, fuel-efficient, and perfect for city drives or long-distance travel.'}}


        </p>



    </div>


</section>
