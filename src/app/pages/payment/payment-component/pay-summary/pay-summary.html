<!-- ========================= -->
<!-- PAYMENT DETAILS SECTION -->
<!-- ========================= -->

<section style="padding:80px 0; background:#f8f9fa;">

    <div class="container">

        <div class="row g-4">

            <!-- ========================= -->
            <!-- PAYMENT METHOD FORM -->
            <!-- ========================= -->

            <div class="col-lg-7">

                <div class="card border-0 shadow-sm" style="border-radius:15px;">

                    <div class="card-body p-5">

                        <h3 class="fw-bold mb-4">
                            Select Payment Method
                        </h3>

                        <!-- Payment Options -->
                        <div class="mb-4">

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="payment" checked>
                                <label class="form-check-label">Credit Card</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="payment">
                                <label class="form-check-label">Debit Card</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="payment">
                                <label class="form-check-label">Bank Transfer</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="payment">
                                <label class="form-check-label">Cash on Pickup</label>
                            </div>

                        </div>

                        <hr>

                        <!-- Card Details -->
                        <h5 class="fw-bold mb-3">
                            Card Details
                        </h5>

                        <div class="row g-3">

                            <div class="col-12">
                                <label class="form-label">Card Number</label>
                                <input type="text" class="form-control" placeholder="1234 5678 9012 3456">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Expiry Date</label>
                                <input type="text" class="form-control" placeholder="MM/YY">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">CVV</label>
                                <input type="password" class="form-control" placeholder="123">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Card Holder Name</label>
                                <input type="text" class="form-control" placeholder="John Doe">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- ========================= -->
            <!-- BOOKING SUMMARY -->
            <!-- ========================= -->

            <div class="col-lg-5">

                <div class="card border-0 shadow-lg"
                     style="border-radius:15px; position:sticky; top:90px;">

                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-3">
                            Booking Summary
                        </h4>

                        <hr>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Vehicle</span>
                            <strong>Toyota Axio</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Days</span>
                            <strong>2 Days</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Price / Day</span>
                            <strong>Rs. 8,500</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Driver</span>
                            <strong>No</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Deposit</span>
                            <strong>Rs. 20,000</strong>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">

                            <h5>Total</h5>

                            <h3 class="text-primary fw-bold">
                                Rs. 37,000
                            </h3>

                        </div>

                        <button class="btn btn-success btn-lg w-100" style="border-radius:10px;">
                            Confirm Payment
                        </button>

                        <button class="btn btn-outline-secondary w-100 mt-3" style="border-radius:10px;">
                            Back to Booking
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
