<!-- ========================= -->
<!-- VEHICLE CARD COMPONENT -->
<!-- ========================= -->

<div class="col-lg-4 col-md-6 mb-4">

    <div class="card border-0 shadow-sm h-100"
         style="border-radius:15px; overflow:hidden; transition:0.3s;"
         onmouseover="this.style.transform='translateY(-5px)'"
         onmouseout="this.style.transform='translateY(0)'">

        <!-- Vehicle Image -->
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=800&q=80"
             class="card-img-top"
             style="height:180px; object-fit:cover;">

        <div class="card-body p-3">

            <!-- Title -->
            <h5 class="fw-bold mb-1">
                Toyota Axio 2018
            </h5>

            <small class="text-muted">
                Sedan • Automatic
            </small>

            <!-- Features -->
            <div class="d-flex justify-content-between mt-2 text-muted small">
                <span>⛽ Petrol</span>
                <span>👥 5 Seats</span>
                <span>⚙ Auto</span>
            </div>

            <!-- Price -->
            <div class="mt-3">
                <span class="fw-bold fs-5 text-primary">
                    Rs. 8,500
                </span>
                <span class="text-muted">/ day</span>
            </div>

            <!-- Availability -->
            <span class="badge bg-success mt-2">
                Available
            </span>

        </div>

        <!-- Buttons -->
        <div class="card-footer bg-white border-0 d-flex gap-2 p-3">

            <button class="btn btn-outline-primary w-50"
                    style="border-radius:10px;">
                View Details
            </button>

            <button class="btn btn-primary w-50"
                    style="border-radius:10px;">
                Book Now
            </button>

        </div>

    </div>

</div>
