<!-- ========================= -->
<!-- VEHICLE CARD COMPONENT -->
<!-- ========================= -->

<div class="card border-0 shadow-sm h-100"
     style="border-radius:15px; overflow:hidden; transition:0.3s;"
     onmouseover="this.style.transform='translateY(-5px)'"
     onmouseout="this.style.transform='translateY(0)'">

    <!-- Vehicle Image -->

    <img
        [src]="vehicle.imageUrl?.startsWith('http')
            ? vehicle.imageUrl
            : 'assets/images/' + vehicle.imageUrl"
        class="card-img-top"
        alt="{{ vehicle.brand }} {{ vehicle.model }}"
        style="height:180px; object-fit:cover;">

    <!-- Card Body -->

    <div class="card-body p-3">

        <h5 class="fw-bold mb-1">
            {{ vehicle.brand }} {{ vehicle.model }}
        </h5>

        <small class="text-muted">
            {{ vehicle.type }}
        </small>

        <!-- Features -->

        <div class="d-flex justify-content-between mt-3 text-muted small">

            <span>
                ⛽ {{ vehicle.fuelType }}
            </span>

            <span>
                👥 {{ vehicle.seats }} Seats
            </span>

        </div>

        <!-- Price -->

        <div class="mt-3">

            <span class="fw-bold fs-5 text-primary">
                Rs. {{ vehicle.pricePerDay }}
            </span>

            <span class="text-muted">
                / day
            </span>

        </div>

        <!-- Availability -->

        <div class="mt-3">

            <span
                class="badge"
                [class.bg-success]="vehicle.available"
                [class.bg-danger]="!vehicle.available">

                {{ vehicle.available ? 'Available' : 'Not Available' }}

            </span>

        </div>

    </div>

    <!-- Footer -->

    <div class="card-footer bg-white border-0 d-flex gap-2 p-3">

        <button
            class="btn btn-outline-primary w-50"
            [routerLink]="['/vehicle-details', vehicle.id]"
            style="border-radius:10px;">

            View Details

        </button>

        <button
            class="btn btn-primary w-50"
            [routerLink]="['/bookings', vehicle.id]"
            style="border-radius:10px;">

            Book Now

        </button>

    </div>

</div>9
