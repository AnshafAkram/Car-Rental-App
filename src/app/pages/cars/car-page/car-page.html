<!-- ========================= -->
<!-- CAR PAGE -->
<!-- ========================= -->

<app-car-banner></app-car-banner>

<div class="container mt-4">
    <app-car-search></app-car-search>
</div>

<div class="container mt-4">

    <div class="row">

        <!-- LEFT FILTER -->
        <div class="col-lg-3 col-md-4 mb-4">

            <app-car-filter></app-car-filter>

        </div>

        <!-- RIGHT VEHICLES -->
        <div class="col-lg-9 col-md-8">

            <!-- Loading -->
            <div *ngIf="loading" class="alert alert-info">
                Loading vehicles...
            </div>

            <!-- Error -->
            <div *ngIf="loadError" class="alert alert-danger">

                Failed to load vehicles.

                <button
                    class="btn btn-sm btn-light ms-2"
                    (click)="loadVehicles()">

                    Retry

                </button>

            </div>

            <!-- No Vehicles -->
            <div
                *ngIf="!loading && !loadError && vehicles.length === 0"
                class="alert alert-warning">

                No vehicles available.

            </div>

            <!-- Vehicle Cards -->
            <div
                class="row g-4"
                *ngIf="!loading && vehicles.length > 0">

                <div
                    class="col-lg-4 col-md-6"
                    *ngFor="let vehicle of vehicles">

                    <app-car-card
                        [vehicle]="vehicle">
                    </app-car-card>

                </div>

            </div>

        </div>

    </div>

</div>

<app-car-cta></app-car-cta>

<app-footer></app-footer>
